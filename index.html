<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toddy Universe</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050505;
            color: white;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* BACKGROUND ANIMADO */
        .bg-animation {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -3;
            background: radial-gradient(circle at 20% 20%,#1a1a1a 0%,transparent 25%), radial-gradient(circle at 80% 30%,#111 0%,transparent 30%), radial-gradient(circle at 50% 80%,#151515 0%,transparent 35%);
            animation: bgMove 12s infinite alternate ease-in-out;
        }

        @keyframes bgMove {
            0% {
                transform: scale(1);
            }

            100% {
                transform: scale(1.15);
            }
        }

        /* HEADER */
        header {
            padding: 30px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .nav {
            display: flex;
            gap: 20px;
        }

            .nav a {
                text-decoration: none;
                color: #aaa;
                transition: .3s;
            }

                .nav a:hover {
                    color: #fff;
                }

        /* HERO */
        .hero {
            min-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .hero-box {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }

        /* ESQUERDA */
        .left h1 {
            font-size: 70px;
            line-height: 1;
            font-weight: 900;
            margin-bottom: 20px;
        }

            .left h1 span {
                color: #888;
            }

        .left p {
            color: #888;
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        /* BOTÕES */
        .buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 16px 28px;
            background: #111;
            border: 1px solid #222;
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-weight: bold;
            transition: .3s;
        }

            .btn:hover {
                transform: translateY(-4px);
                background: #191919;
                box-shadow: 0 0 25px #ffffff15;
            }

        /* DIREITA */
        .right {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .orb {
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: radial-gradient(circle,#2a2a2a,#0a0a0a);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 80px rgba(255,255,255,.08), inset 0 0 40px rgba(255,255,255,.05);
            animation: float 4s infinite ease-in-out;
            position: relative;
        }

            .orb img {
                width: 85%;
                height: 85%;
                object-fit: cover;
                border-radius: 50%;
            }

        @keyframes float {
            0%,100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        /* SOCIAL BOX */
        .socials {
            padding: 30px 8%;
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .social-card {
            width: 220px;
            padding: 25px;
            background: #0d0d0d;
            border: 1px solid #1f1f1f;
            border-radius: 20px;
            text-align: center;
            transition: .3s;
        }

            .social-card:hover {
                transform: translateY(-8px);
                box-shadow: 0 0 25px #ffffff10;
            }

            .social-card i {
                font-size: 30px;
                margin-bottom: 15px;
            }

            .social-card h3 {
                margin-bottom: 10px;
            }

        /* RESPONSIVO */
        @media(max-width:950px) {

            .hero-box {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .left h1 {
                font-size: 50px;
            }

            .buttons {
                justify-content: center;
            }

            .orb {
                width: 260px;
                height: 260px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <header>
        <div class="logo">TODDY</div>

        <div class="nav">
            <a href="#">Inicio</a>
            <a href="#">Produtos</a>
            <a href="#">Contato</a>
        </div>
    </header>

    <section class="hero">

        <div class="hero-box">

            <div class="left">
                <h1>THE <span>FUTURE</span><br>OF SALES</h1>

                <p>
                    Bem-vindo ao novo nível.
                    Uma experiência premium criada para quem busca qualidade, estilo e exclusividade.
                </p>

                <div class="buttons">
                    <a href="#" class="btn">Comprar Agora</a>
                    <a href="#" class="btn">Entrar Telegram</a>
                </div>
            </div>

            <div class="right">
                <div class="orb">
                    <img src="https://i.pinimg.com/736x/51/cb/c4/51cbc41f12da0a20f1cb0d15aa09ed21.jpg">
                </div>
            </div>

        </div>

    </section>

    <section class="socials">

        <div class="social-card">
            <i class="fab fa-instagram"></i>
            <h3>Instagram</h3>
            <p>@edzxdk7</p>
        </div>

        <div class="social-card">
            <i class="fab fa-telegram"></i>
            <h3>Telegram</h3>
            <p>@toddy_vendas</p>
        </div>

        <div class="social-card">
            <i class="fab fa-whatsapp"></i>
            <h3>WhatsApp</h3>
            <p>Atendimento</p>
        </div>

    </section>

</body>
</html>
